<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=servicios.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de Cotización | Taller Industrial Alkan S.A.S.</title>
  <script>
    // Redirección inmediata conservando parámetros si existen
    const search = window.location.search;
    window.location.replace('servicios.html' + (search || ''));
  </script>
  <style>
    body {
      background-color: #0B111A;
      color: #CBD5E1;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #101924;
      border: 1px solid #1E2D40;
      border-radius: 12px;
      padding: 32px;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(58, 131, 78, 0.2);
      border-top-color: #3A834E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      color: #FFFFFF;
      font-size: 18px;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 13px;
      color: #94A3B8;
      margin: 0 0 20px 0;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      background-color: #235832;
      color: #FFFFFF;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    a:hover {
      background-color: #2E6F40;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Módulo de Cotización Actualizado</h1>
    <p>Las solicitudes de cotización técnica ahora se gestionan directamente en nuestro catálogo interactivo de servicios.</p>
    <a href="servicios.html">Continuar a Servicios y Cotización →</a>
  </div>
</body>
</html>
